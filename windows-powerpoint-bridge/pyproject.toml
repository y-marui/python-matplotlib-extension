[project]
name = "windows-powerpoint-bridge"
version = "0.1.0"
description = "Windows-only, extraction-only bridge for the selected embedded OLE Figure in PowerPoint for Windows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "matplotlib-extension",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
windows-powerpoint-bridge = "windows_powerpoint_bridge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
matplotlib-extension = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# pywin32 is Windows-only and carries no type stubs usable on this
# development platform; its import in com_selection.py is lazy
# (inside a function, guarded by try/except ImportError) specifically
# so this sub-project loads and tests on macOS/Linux too.
module = ["win32com.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["windows_powerpoint_bridge"]
